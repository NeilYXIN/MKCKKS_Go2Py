name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.2
          enable-cache: true
      - run: uv sync --locked --all-groups
      # Core source gates run through scripts/check.sh. Stages are split into
      # steps for readable status reporting; CI-only examples and wheel jobs
      # follow separately.
      - name: Verify protected upstream snapshot
        run: bash scripts/check.sh upstream
      - name: Protected and bridge Go tests, vet, race detector, coverage
        run: bash scripts/check.sh go race coverage
      - name: Python correctness, coverage, and 1,000-cycle lifecycle suite
        run: bash scripts/check.sh pytest
      - name: Full standalone C ABI suite and symbol snapshot
        run: bash scripts/check.sh cabi abi
      - name: Static quality and licensing
        run: bash scripts/check.sh lint types licence
      - name: Audit locked dependencies for known vulnerabilities
        run: bash scripts/check.sh audit
      - name: Execute notebook
        run: uv run jupyter nbconvert --to notebook --execute tutorial.ipynb --output-dir /tmp --output tutorial-executed.ipynb
      - name: Execute distributed-process example
        run: uv run python examples/distributed.py

  linux-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.2
      - run: uv build --wheel
        env:
          SOURCE_DATE_EPOCH: "1704067200"
      - name: Clean-wheel encrypted smoke test
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-linux-wheel
          path: dist/*.whl
          if-no-files-found: error

  macos-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.2
      - run: uv sync --locked --all-groups
      - run: uv build --wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          SOURCE_DATE_EPOCH: "1704067200"
      - run: uv run delocate-listdeps --all dist/*.whl
      - name: Clean-wheel encrypted smoke test
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python scripts/wheel_smoke.py
