name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.2
          enable-cache: true
      - run: uv sync --locked --all-groups
      # Core source gates run through scripts/check.sh. Stages are split into
      # steps for readable status reporting; CI-only examples and wheel jobs
      # follow separately.
      - name: Verify protected upstream snapshot
        run: bash scripts/check.sh upstream
      - name: Protected and bridge Go tests, vet, race detector, coverage
        run: bash scripts/check.sh go race coverage
      - name: Python correctness, coverage, and 1,000-cycle lifecycle suite
        run: bash scripts/check.sh pytest
      - name: Full standalone C ABI suite and symbol snapshot
        run: bash scripts/check.sh cabi abi
      - name: Static quality and licensing
        run: bash scripts/check.sh lint types licence
      - name: Audit locked dependencies for known vulnerabilities
        run: bash scripts/check.sh audit
      - name: Execute notebook
        run: uv run jupyter nbconvert --to notebook --execute tutorial.ipynb --output-dir /tmp --output tutorial-executed.ipynb
      - name: Execute distributed-process example
        run: uv run python examples/distributed.py

  linux-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.2
      - run: uv build --wheel
        env:
          SOURCE_DATE_EPOCH: "1704067200"
      - name: Clean-wheel encrypted smoke test
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-linux-wheel
          path: dist/*.whl
          if-no-files-found: error

  macos-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.2
      - run: uv sync --locked --all-groups
      - run: uv build --wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          SOURCE_DATE_EPOCH: "1704067200"
      - run: uv run delocate-listdeps --all dist/*.whl
      - name: Clean-wheel encrypted smoke test
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python scripts/wheel_smoke.py
